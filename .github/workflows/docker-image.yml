# .github/workflows/ci-test-build.yml
name: ✅ ONLYOFFICE Build Test (with Docker)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-products:
    name: 🛠️ Build ${{ matrix.products || 'all' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        products:
          - ""               # all
          - desktop
          - server
          - builder
          - "desktop server"

    steps:
      - name: Checkout build_tools
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/build_tools
          ref: master

      - name: Build local “builder” image
        run: |
          docker build \
            --file Dockerfile \
            --tag onlyoffice-builder:latest \
            .

      - name: Run ONLYOFFICE build (${{ matrix.products || 'all' }})
        run: |
          mkdir -p out
          docker run --rm \
            -v $PWD:/build_tools \
            onlyoffice-builder:latest \
            bash -lc "\
              apt-get update && \
              apt-get install -y curl python3 && \
              curl -fsSL https://deb.nodesource.com/setup_18.x | bash - && \
              apt-get install -y nodejs && \
              ln -sf /usr/bin/python3 /usr/bin/python && \
              export PYTHONPATH=/build_tools/scripts && \
              cd /build_tools/tools/linux && \
              python3 automate.py ${{ matrix.products }} \
            "

      - name: List build output
        run: ls -R out
