name: ONLYOFFICE Docker CI with Free-Space Cleanup

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  FREE_SPACE_SCRIPT: https://raw.githubusercontent.com/apache/arrow/refs/heads/main/ci/scripts/util_free_space.sh

jobs:
  # 1) Build the “builder” image once, after pruning free space.
  build-image:
    runs-on: ubuntu-20.04
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - name: Checkout build_tools
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/build_tools
          ref: master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Free up host disk space
        run: |
          curl -fsSL $FREE_SPACE_SCRIPT | bash
          sudo docker system prune --all --force || true

      - name: Build ONLYOFFICE builder image
        id: build
        run: |
          IMAGE_TAG=onlyoffice-builder:latest
          docker build \
            --file Dockerfile \
            --tag $IMAGE_TAG \
            --build-arg DEBIAN_FRONTEND=noninteractive \
            .
          echo "::set-output name=image-tag::$IMAGE_TAG"

  # 2) For each product (all, desktop, server, builder, desktop+server), mount the full workspace 
  #    so compiled artifacts go onto the runner’s FS, *then* free space again before compile.
  build-products:
    needs: build-image
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        product:
          - ""               # means “all”
          - desktop
          - server
          - builder
          - "desktop server"

    steps:
      - name: Checkout build_tools
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/build_tools
          ref: master

      - name: Prepare output directory
        run: |
          rm -rf out
          mkdir out

      - name: Free up host disk space
        run: |
          curl -fsSL $FREE_SPACE_SCRIPT | bash
          sudo docker system prune --all --force || true

      - name: Run ONLYOFFICE build (${{ matrix.product || 'all' }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build_tools" \
            ${{ needs.build-image.outputs.image-tag }} \
            bash -lc "\
              cd /build_tools/tools/linux && \
              python3 automate.py ${matrix.product} \
            "

      - name: List build output
        run: ls -R out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: onlyoffice-${{ matrix.product || 'all' }}-output
          path: out/
