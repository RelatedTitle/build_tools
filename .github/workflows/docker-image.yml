name: 🚀 ONLYOFFICE CI & Docker Build (Optimized)

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

env:
  FREE_SPACE_SCRIPT: https://raw.githubusercontent.com/apache/arrow/refs/heads/main/ci/scripts/util_free_space.sh
  CCACHE_MAX_SIZE: 10G

jobs:
  # 1) Detect which modules changed
  detect-changes:
    runs-on: ubuntu-20.04
    outputs:
      changed-matrix: ${{ steps.set-matrix.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine changed products
        id: set-matrix
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E 'tools/linux|core|server' \
            | awk '
                /tools\/linux/ { m="all" }
                /core/        { m="desktop" }
                /server/      { m="server" }
              ' \
            | sort -u \
            | paste -sd, -)
          if [ -z "$CHANGED" ]; then
            CHANGED="all"
          fi
          # Format as JSON array: ["all"] or ["desktop","server"]
          ITEMS=$(printf '"%s",' ${CHANGED//,/ })
          ITEMS="[${ITEMS%,}]"
          echo "::set-output name=changed::$ITEMS"

  # 2) Build reusable Docker image
  build-image:
    needs: detect-changes
    runs-on: ubuntu-20.04
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '2048'
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Checkout build_tools
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/build_tools
          ref: master

      - name: Cache Qt & ccache
        uses: actions/cache@v3
        with:
          path: |
            tools/linux/qt_build
            ~/.ccache
          key: ${{ runner.os }}-onlyoffice-deps-${{ hashFiles('tools/linux/**') }}
          restore-keys: |
            ${{ runner.os }}-onlyoffice-deps-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Free up host disk space
        run: |
          curl -fsSL "${{ env.FREE_SPACE_SCRIPT }}" | bash
          sudo docker system prune --all --force || true

      - name: Build ONLYOFFICE builder image
        id: build
        run: |
          IMAGE_TAG=onlyoffice-builder:latest
          docker build \
            --file Dockerfile \
            --tag "${IMAGE_TAG}" \
            --build-arg DEBIAN_FRONTEND=noninteractive \
            --build-arg CCACHE_MAXSIZE="${{ env.CCACHE_MAX_SIZE }}" \
            .
          echo "::set-output name=image-tag::${IMAGE_TAG}"

  # 3) Run builds in parallel for changed modules
  build-products:
    needs: build-image
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJson(needs.detect-changes.outputs.changed-matrix) }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '2048'
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Checkout build_tools
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/build_tools
          ref: master

      - name: Prepare output directory
        run: |
          rm -rf out
          mkdir out

      - name: Cache Qt & ccache
        uses: actions/cache@v3
        with:
          path: |
            tools/linux/qt_build
            ~/.ccache
          key: ${{ runner.os }}-onlyoffice-deps-${{ hashFiles('tools/linux/**') }}
          restore-keys: |
            ${{ runner.os }}-onlyoffice-deps-

      - name: Free up host disk space
        run: |
          curl -fsSL "${{ env.FREE_SPACE_SCRIPT }}" | bash
          sudo docker system prune --all --force || true

      - name: Run ONLYOFFICE build (${{ matrix.product }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build_tools" \
            "${{ needs.build-image.outputs.image-tag }}" \
            bash -lc "\
              export CC='ccache gcc' CXX='ccache g++' && \
              ccache -s && \
              cd /build_tools/tools/linux && \
              python3 automate.py ${matrix.product} --jobs=$(nproc) \
            "

      - name: Show ccache stats
        run: ccache -s || true

      - name: List build output
        run: ls -R out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: onlyoffice-${{ matrix.product }}-output
          path: out/
