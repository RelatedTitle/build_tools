# .github/workflows/ci-test-build.yml
name: ✅ ONLYOFFICE Build Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-products:
    name: 🛠️ Build ${{ matrix.products || 'all' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        products:
          - ""               # all
          - "desktop"
          - "server"
          - "builder"
          - "desktop server"

    steps:
      - name: Checkout build_tools
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/build_tools
          ref: master

      - name: Build local “builder” image
        run: |
          docker build \
            --file Dockerfile \
            --tag onlyoffice-builder:latest \
            .

      - name: Run build for ${{ matrix.products || 'all' }}
        run: |
          mkdir -p out
          docker run --rm \
            -v $PWD/out:/build_tools/out \
            onlyoffice-builder:latest \
            ${{ matrix.products }}

      - name: List build output
        run: ls -R out
